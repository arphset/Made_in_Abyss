[browser]
gatherUsageStats = false

[client]
# Скрыть кнопку Deploy и меню разработчика Streamlit для пользователей
toolbarMode = "viewer"

[server]
enableCORS = false
enableXsrfProtection = false
# Файловое хранилище не раздаётся как статика (S.01.03, задача 7.2)
enableStaticServing = false

[theme]
base = "dark"
